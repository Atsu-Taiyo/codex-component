<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>ことばの宝箱 — Codex Playground</title>
<style>html,body{margin:0;background:#f7f4fc;color:#302649;font-family:system-ui,sans-serif}#frame{width:min(100vw,calc(100vh * 1.6));margin:0 auto}canvas{display:block;width:100%;aspect-ratio:1.6;outline:none}#loading{text-align:center;padding:24vh 24px}progress{accent-color:#7556d8;width:240px}audio{display:block;margin:12px auto}#error{white-space:pre-wrap;color:#a03954;padding:20px;text-align:center}</style>
<div id="frame"><div id="loading"><h1>ことばの宝箱</h1><p>小さな冒険を準備しています…</p><progress max="1" value="0"></progress></div><canvas id="game" width="1280" height="800" tabindex="0" style="display:none"></canvas><div id="error"></div></div>
<script>
(async()=>{
const pairing=new URLSearchParams(location.hash.slice(1));history.replaceState(null,'',location.pathname+location.search);
try{
 const names=await (await fetch('/bootstrap.json')).json();
 const script=document.createElement('script');script.src=names.loader;document.body.append(script);await new Promise((r,j)=>{script.onload=r;script.onerror=j;});
 const canvas=document.querySelector('canvas');canvas.style.display='block';document.querySelector('#loading').style.padding='8px';
 const instance=await createUnityInstance(canvas,{dataUrl:names.data,frameworkUrl:names.framework,codeUrl:names.wasm,streamingAssetsUrl:'StreamingAssets',companyName:'Codex Component',productName:'ことばの宝箱',productVersion:'0.1.0'},p=>document.querySelector('progress').value=p);
 document.querySelector('#loading').remove();canvas.focus();
 if(pairing.has('token'))instance.SendMessage('TreasureGame','ConnectFromPage',JSON.stringify({token:pairing.get('token'),baseUrl:pairing.get('baseUrl')||'http://127.0.0.1:8791/api/ai'}));
}catch(e){document.querySelector('#error').textContent='起動できませんでした：'+String(e);}
})();
</script></html>
