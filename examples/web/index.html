<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Codex Component / Playground</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;color:#232827;background:#f7f8f5;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid #d4dad4;border-radius:8px;background:white;padding:10px 15px;color:inherit}button:disabled{opacity:.45;cursor:default}button.primary{background:#285741;border-color:#285741;color:white}header{height:76px;border-bottom:1px solid #dce0d9;padding:0 34px;display:flex;align-items:center;justify-content:space-between;background:white}.brand{font-weight:700;font-size:18px;letter-spacing:-.5px}.badge{font-size:11px;border:1px solid #d7dfd7;border-radius:5px;padding:4px 7px;letter-spacing:1px;margin-left:12px;color:#58715f}main{max-width:1180px;margin:auto;padding:44px 28px;display:grid;grid-template-columns:260px 1fr;gap:44px}aside h1{font-size:30px;letter-spacing:-1.2px;line-height:1.25;margin:0 0 12px}p{line-height:1.7}aside p{font-size:13px;color:#66716a;margin-bottom:32px}.label,label{display:block;font-size:12px;color:#657067;font-weight:600;margin:20px 0 8px}select,input[type=password]{width:100%;border:1px solid #d5ddd4;background:white;border-radius:7px;padding:10px}section{min-width:0}.panel{background:white;border:1px solid #dbe0d8;border-radius:14px;overflow:hidden}.panelhead{padding:17px 22px;border-bottom:1px solid #e6e9e3;font-size:13px;display:flex;justify-content:space-between;align-items:center}#status{font-size:12px;color:#57765c}#output{min-height:290px;padding:27px;white-space:pre-wrap;line-height:1.8;overflow-wrap:anywhere;font-size:14px}#output:empty:before{content:'何をつくりましょうか。\Aプロンプトを入力して、接続を試してみてください。';color:#99a39a}#images{display:flex;flex-wrap:wrap;gap:10px;padding:0 24px}#images img{max-width:100%;max-height:400px;border-radius:10px;margin-bottom:20px}form{border-top:1px solid #e6e9e3;padding:18px}textarea{resize:vertical;width:100%;min-height:98px;padding:10px;border:0;outline:none;line-height:1.6}.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.spacer{flex:1}#error{color:#a22d38;font-size:13px;white-space:pre-wrap;margin:16px 0}.note{font-size:12px;color:#778277;margin-top:16px}.tools{margin-top:25px;border-top:1px solid #dce0d9;padding-top:8px}.tools button{margin-top:8px;font-size:12px}input[type=file]{font-size:11px;max-width:100%;margin:4px 0 10px}#activity{font-size:11px;color:#7b847c}#connect{margin-top:8px;width:100%}#tokenBox{margin-top:20px}footer{font-size:11px;color:#8a948a;margin-top:28px}audio{width:100%;height:32px;margin-top:12px}@media(max-width:760px){header{padding:0 20px}main{grid-template-columns:1fr;gap:24px;padding:25px 18px}aside h1{font-size:25px}aside p{margin-bottom:12px}.tools{display:flex;gap:10px;flex-wrap:wrap}#output{min-height:200px}.badge{display:none}}
</style></head>
<body><header><div class="brand">◈ codex-component <span class="badge">PLAYGROUND</span></div><span id="status">接続を準備中</span></header>
<main><aside><h1>Your UI.<br>Codex inside.</h1><p>チャット、画像、音声。<br>必要な機能を、あなたのアプリへ。</p>
<label for="model">MODEL</label><select id="model"><option value="">Codexの既定値</option></select>
<label for="effort">REASONING EFFORT</label><select id="effort"><option value="">既定値</option></select>
<div id="tokenBox" hidden><label for="token">ローカル接続トークン</label><input type="password" id="token" autocomplete="off"><button id="connect">接続</button></div>
<div class="tools"><div><label for="audioFile">音声ファイル → 文字起こし</label><input id="audioFile" type="file" accept="audio/*"><button id="transcribe">文字起こし（API）</button></div><div><button id="voice">音声会話（実験的）</button><button id="speak">回答を読み上げ（API）</button></div></div>
<p class="note">音声APIは別途APIキーが必要です。音声会話の対応はCodexの認証・バージョンに依存します。読み上げ音声はAI生成です。</p><audio id="audio" controls></audio><footer>Local bridge · TypeScript · Open source</footer></aside>
<section><div class="panel"><div class="panelhead"><span>Conversation</span><button id="reset">新しい会話</button></div><div id="output" role="log" aria-live="polite"></div><div id="images"></div><form id="form"><textarea id="prompt" aria-label="プロンプト" placeholder="アイデアを説明してください…" required></textarea><label for="imageFile">参考画像（任意）</label><input id="imageFile" type="file" accept="image/png,image/jpeg,image/webp"><div class="actions"><span id="activity"></span><span class="spacer"></span><button id="stop" type="button" disabled>停止</button><button id="generate" type="button">画像を生成</button><button id="send" type="submit" class="primary">送信 ↗</button></div></form></div><div id="error" role="alert"></div><p class="note">このデモは1人用のローカル接続です。コードは examples/web にあります。</p></section></main><script type="module" src="/app.js"></script></body></html>
